name: Build macOS Package for Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-13
      fail-fast: false

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build macOS Application Bundle
        run: make -C packaging macos VERSION=${{ github.ref_name }}

      - name: Verify generated macOS package
        run: ls -lh dist/*.zip

      - name: Upload to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" dist/*.zip --clobber